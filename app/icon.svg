  <circle cx="32" cy="32" r="17.2" fill="none" stroke="#e46a6e" stroke-width="0.7" opacity="0.5" />
  <!-- AB: pressed in (a light edge above, the letter in shadow). -->
  <text x="32.6" y="40.2" text-anchor="middle" font-family="'Playfair Display', Georgia, 'Times New Roman', serif" font-weight="900" font-size="20" fill="#e8686c" opacity="0.55">AB</text>
  <text x="32" y="39.5" text-anchor="middle" font-family="'Playfair Display', Georgia, 'Times New Roman', serif" font-weight="900" font-size="20" fill="#4f060b">AB</text>
