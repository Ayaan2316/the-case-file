name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm build
      - run: pnpm budgets
      # github's runners have no GPU so the full 3D tests (experience, phones, screenshots)
      # time out there. run those locally, CI covers everything that doesn't need a GPU
      - run: pnpm test:e2e tests/content.spec.ts tests/lite.spec.ts tests/fallback.spec.ts tests/old-laptops.spec.ts tests/resume.spec.ts tests/site.spec.ts
